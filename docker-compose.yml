version: '3.3'

services:
  mailman-digest:
    build:
      context: .
      dockerfile: Dockerfile
    image: mailman-digest:latest
    container_name: mailman-digest
    restart: always
    
    environment:
      - TZ=Asia/Shanghai
    
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M